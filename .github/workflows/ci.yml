name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys

      - name: Run all test programs
        run: make test

      - name: Run module-level testbenches
        run: make unit

      - name: Lint (Verilator)
        run: make lint

      - name: Elaboration and structural checks (Yosys)
        run: make synth
